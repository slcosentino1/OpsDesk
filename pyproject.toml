[project]
name = "opsdesk"
version = "0.1.0"
description = "Internal support agent. Uses AskDoc as an HTTP RAG service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "langgraph>=0.4",
    "openai>=1.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsdesk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
